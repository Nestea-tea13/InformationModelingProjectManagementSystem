<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/common-tables.css" />
</head>
<body>
<header th:insert="blocks/headers :: header-user-page"></header>

<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <span th:text="${pageTitle}"></span>
                <span class="badge ml-2" 
                      th:classappend="${currentStatus.name() == 'ASSIGNED' ? 'badge-secondary' : 
                                      (currentStatus.name() == 'IN_PROGRESS' ? 'badge-primary' : 
                                      (currentStatus.name() == 'REVIEW' ? 'badge-warning' : 
                                      (currentStatus.name() == 'COMPLETED' ? 'badge-success' : 'badge-danger')))}"
                      th:text="${currentStatus.displayName}"></span>
            </h4>
            <a th:href="@{${type == 'forMe' ? '/tasks/for-me' : '/tasks/by-me'}}" class="btn btn-secondary btn-sm">← Назад к доске</a>
        </div>
        <div class="card-body">
            <!-- Фильтры -->
            <form method="get" th:action="@{/tasks/list}" class="form-inline justify-content-center mb-3">
                <input type="hidden" name="type" th:value="${type}">
                <div class="form-group mr-2">
                    <label class="mr-2">Проект:</label>
                    <select name="projectId" class="form-control" onchange="this.form.submit()">
                        <option value="">— Все проекты —</option>
                        <option th:each="project : ${userProjects}" 
                                th:value="${project.id}" 
                                th:text="${project.name}"
                                th:selected="${selectedProjectId != null and selectedProjectId == project.id}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="mr-2">Статус:</label>
                    <select name="status" class="form-control" onchange="this.form.submit()">
                        <option th:each="s : ${statuses}" 
                                th:value="${s.name()}" 
                                th:text="${s.displayName}"
                                th:selected="${s == currentStatus}"></option>
                    </select>
                </div>
            </form>

            <!-- Таблица задач -->
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="thead-light">
                        <tr>
                            <th style="width: 5%">№</th>
                            <th style="width: 20%">Название</th>
                            <th th:if="${selectedProjectId == null}" style="width: 20%">Проект</th>
                            <th th:if="${showExecutor}" style="width: 15%">Исполнитель</th>
                            <th th:unless="${showExecutor}" style="width: 15%">Автор</th>
                            <th style="width: 30%">Описание</th>
                            <th style="width: 10%">Срок</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="task, iterStat : ${tasks}">
                            <td th:text="${iterStat.count}"></td>
                            <td>
                                <a th:href="@{'/projects/' + ${task.project.id} + '/tasks/' + ${task.id}}" th:text="${task.title}"></a>
                            </td>
                            <td th:if="${selectedProjectId == null}" th:text="${task.project.name}"></td>
                            <td th:if="${showExecutor}" th:text="${task.assignee.sername + ' ' + task.assignee.name}"></td>
                            <td th:unless="${showExecutor}" th:text="${task.assigner.sername + ' ' + task.assigner.name}"></td>
                            <td th:text="${task.description != null and task.description != '' ? task.description : '—'}"></td>
                            <td th:classappend="${task.overdue} ? 'text-danger' : ''" th:text="${task.formattedDeadline}"></td>
                        </tr>
                        <tr th:if="${tasks.isEmpty()}">
                            <td colspan="7" class="text-center text-muted py-4">Нет задач</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
