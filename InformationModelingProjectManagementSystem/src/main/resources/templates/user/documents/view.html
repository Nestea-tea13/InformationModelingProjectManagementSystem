<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Просмотр документа</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/headers :: header-user-page"></header>

<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <strong>📄 Просмотр документа: </strong>
                <span th:text="${doc.originalName}"></span>
            </div>
            <div>
                <a th:href="@{'/documents?projectId=' + ${doc.project.id}}" class="btn btn-secondary btn-sm">← К документам</a>
            </div>
        </div>
        <div class="card-body">
            <div class="d-flex align-items-left mb-3">
                <span class="text-muted mr-1">Проект: </span>
                <strong class="font-weight-bold" th:text="${doc.project.name}"></strong>
            </div>
            <iframe th:src="@{/documents/view-file/{id}(id=${doc.id})}" width="100%" height="600px" frameborder="0"></iframe>
        </div>
    </div>
    <br>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
