<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Документация проектов</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/common-tables.css" />
    <link type="text/css" rel="StyleSheet" href="https://bootstraptema.ru/plugins/2016/remodal/remodal.css" />
    <link type="text/css" rel="StyleSheet" href="https://bootstraptema.ru/plugins/2016/remodal/remodal-default-theme.css" />
    <script src="https://bootstraptema.ru/plugins/jquery/jquery-1.11.3.min.js"></script>
    <script src="https://bootstraptema.ru/plugins/2016/remodal/remodal.js"></script>
    <script src="/js/table-search.js"></script>
    <style>
        [data-tooltip] {
            position: relative;
            cursor: pointer;
        }
        [data-tooltip]:before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 10px;
            background-color: #333;
            color: white;
            font-size: 12px;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        [data-tooltip]:hover:before {
            opacity: 1;
            visibility: visible;
        }
        .search-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .search-input {
            width: 280px;
        }
        .clear-btn {
            cursor: pointer;
        }
    </style>
</head>

<body>
<header th:insert="blocks/headers :: header-user-page"></header>

<div class="container mt-4">
    <h3 class="text-center mb-4">Документация проектов</h3>

    <div class="filter-bar text-center mb-4">
        <form method="get" action="/documents" class="form-inline justify-content-center">
            <label class="mr-2">Проект:</label>
            <select name="projectId" class="form-control mr-2" style="min-width: 260px;" onchange="this.form.submit()">
                <option value="">— Не выбрано —</option>
                <option th:each="p : ${userProjects}" th:value="${p.id}" th:text="${p.name}" th:selected="${selectedProjectId == p.id}"></option>
            </select>
            <a th:href="@{/documents}" class="btn btn-sm btn-secondary">Сбросить</a>
        </form>
    </div>

    <div th:if="${selectedProjectId == null}" class="alert alert-info text-center">
        Выберите проект, чтобы увидеть утверждённые документы.
    </div>
    <div th:if="${selectedProjectId != null and documents.isEmpty()}" class="alert alert-info text-center">
        Нет утверждённых документов для данного проекта.
    </div>

    <div th:unless="${documents.isEmpty()}" class="card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
            <strong>📄 Перечень документов</strong>
            <div class="search-container">
                <input type="text" id="searchInput" class="form-control form-control-sm search-input" 
                       placeholder="🔍 Поиск по таблице..." data-tooltip="Поиск по любой ячейке">
                <button type="button" id="clearSearchBtn" class="btn btn-sm btn-outline-secondary clear-btn" 
                        data-tooltip="Очистить поиск">
                    ✖
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <table class="table table-bordered table-hover mb-0" id="documentsTable">
                <thead class="thead-light">
                    <tr>
                        <th style="width: 5%">№</th>
                        <th style="width: 41%">Файл</th>
                        <th style="width: 22%">Исполнитель</th>
                        <th style="width: 18%">Дата одобрения</th>
                        <th style="width: 14%">Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="doc, iterStat : ${documents}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${doc.originalName}"></td>
                        <td th:text="${doc.uploadedBy.sername + ' ' + doc.uploadedBy.name}"></td>
                        <td th:text="${#temporals.format(doc.uploadedAt, 'dd.MM.yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/documents/download/{id}(id=${doc.id})}" class="btn btn-sm btn-outline-primary" data-tooltip="Скачать">
                                ⬇️
                            </a>
                            <a th:if="${doc.mimeType != null and (doc.mimeType.startsWith('image/') or doc.mimeType == 'application/pdf')}"
                               th:href="@{/documents/view/{id}(id=${doc.id})}" class="btn btn-sm btn-outline-info ml-1" data-tooltip="Просмотр">
                                👁️
                            </a>
                            <button th:if="${#sets.contains(responsibleProjectIds, doc.project.id)}" 
                                    type="button" class="btn btn-sm btn-outline-danger ml-1"
                                    th:attr="data-remodal-target='modal-delete-' + ${doc.id}" 
                                    data-tooltip="Удалить файл">
                                🗑️
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('[data-remodal-id]').remodal();
    });
</script>

<!-- Модальные окна для удаления файлов -->
<div th:each="doc : ${documents}" th:if="${#sets.contains(responsibleProjectIds, doc.project.id)}">
    <div class="remodal text-center" th:data-remodal-id="'modal-delete-' + ${doc.id}">
        <button data-remodal-action="close" class="remodal-close"></button>
        <h1>Удаление файла</h1>
        <p>Вы действительно хотите удалить файл <strong th:text="${doc.originalName}"></strong>?</p>
        <form th:action="@{'/documents/delete/' + ${doc.id}}" method="post">
            <button type="submit" class="remodal-confirm">Да, удалить</button>
            <button data-remodal-action="cancel" class="remodal-cancel">Нет</button>
        </form>
    </div>
</div>

<script>
    initTableSearch('searchInput', 'clearSearchBtn', 'documentsTable');
</script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
