<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход в систему</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/forms.css" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <style>
        .password-wrapper {
            position: relative;
        }
        .password-control {
            position: absolute;
            top: 38px;
            right: 10px;
            width: 20px;
            height: 20px;
            background: url(https://snipp.ru/demo/495/view.svg) 0 0 no-repeat;
            background-size: contain;
            cursor: pointer;
            z-index: 10;
        }
        .password-control.view {
            background-image: url(https://snipp.ru/demo/495/no-view.svg);
        }
    </style>
</head>
<body>

<header th:insert="blocks/headers :: header-simple"></header>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header">
                    <h5>🔑 Вход в систему</h5>
                </div>
                <div class="card-body">
                    <form action="/process_login" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="form-group">
                            <label>Логин (электронная почта) <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" name="username" id="username" required placeholder="name@example.com">
                        </div>

                        <div class="form-group password-wrapper">
                            <label>Пароль <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" name="password" id="password" required placeholder="Пароль">
                            <a href="#" class="password-control"></a>
                        </div>

                        <div th:if="${param.error}" class="alert alert-danger text-center">
                            Неправильные логин и/или пароль
                        </div>

                        <div class="form-group text-center">
                            <button type="submit" class="btn btn-primary">Войти</button>
                        </div>
                    </form>
                </div>
            </div>
            <br>
        </div>
    </div>
</div>

<script>
    $('body').on('click', '.password-control', function(){
        if ($('#password').attr('type') == 'password'){
            $(this).addClass('view');
            $('#password').attr('type', 'text');
        } else {
            $(this).removeClass('view');
            $('#password').attr('type', 'password');
        }
        return false;
    });
</script>

</body>
</html>
