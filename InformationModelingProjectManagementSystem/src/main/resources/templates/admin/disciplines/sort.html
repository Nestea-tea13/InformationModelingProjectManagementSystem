<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Настройка очередности разделов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/common-tables.css" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        .sortable-row {
            cursor: grab;
        }
        .sortable-row:active {
            cursor: grabbing;
        }
        .sortable-handle {
            cursor: grab;
            text-align: center;
        }
        .sortable-handle:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
<header th:insert="blocks/headers :: header-admin-page"></header>

<div class="container mt-4" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Настройка очередности разделов</h3>
        <a href="/adminpage/disciplines" class="btn btn-secondary">← Назад</a>
    </div>
    <div class="alert alert-info">
        Перетаскивайте строки за значок ☰, чтобы изменить порядок. Порядок от меньшего к большему.
    </div>

    <form id="sortForm" method="post" action="/adminpage/disciplines/update-order">
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-bordered table-hover mb-0">
                    <thead class="thead-light">
                        <tr>
                            <th style="width: 10%"></th>
                            <th style="width: 10%">№</th>
                            <th style="width: 30%">Сокращение</th>
                            <th style="width: 50%">Полное название</th>
                        </tr>
                    </thead>
                    <tbody id="sortable-list">
                        <tr th:each="d, iter : ${disciplines}" class="sortable-row" data-id="${d.id}">
                            <td class="sortable-handle" style="cursor: grab; text-align: center;">☰</td>
                            <td class="sort-order" th:text="${iter.index + 1}"></td>
                            <td th:text="${d.shortName}"></td>
                            <td th:text="${d.fullName}"></td>
                        </table>
                    </tbody>
                </table>
            </div>
        </div>
        <input type="hidden" name="orderIds" id="orderIds">
        <div class="mt-3 text-center">
            <button type="submit" class="btn btn-success" id="saveOrderBtn">💾 Сохранить порядок</button>
            <a href="/adminpage/disciplines" class="btn btn-secondary ml-2">Отмена</a>
        </div>
    </form>
    <br>
</div>

<script>
    var el = document.getElementById('sortable-list');
    var sortable = new Sortable(el, {
        animation: 150,
        handle: '.sortable-handle',
        onEnd: function() {
            // обновляем номера строк
            document.querySelectorAll('#sortable-list tr').forEach((row, idx) => {
                row.querySelector('.sort-order').textContent = idx + 1;
            });
        }
    });

    document.getElementById('saveOrderBtn').addEventListener('click', function(e) {
        e.preventDefault(); // временно отменяем отправку, чтобы заполнить скрытое поле
        var ids = [];
        document.querySelectorAll('#sortable-list tr').forEach(row => {
            ids.push(row.getAttribute('data-id'));
        });
        document.getElementById('orderIds').value = ids.join(',');
        document.getElementById('sortForm').submit();
    });
</script>
</body>
</html>
