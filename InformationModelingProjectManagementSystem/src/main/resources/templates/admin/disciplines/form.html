<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Форма раздела</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/forms.css" />
</head>
<body>
<header th:insert="blocks/headers :: header-admin-page"></header>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 th:text="${discipline.id == 0} ? '➕ Создание раздела' : '✏️ Редактирование раздела'"></h4>
                </div>
                <div class="card-body">
                    <form th:action="${discipline.id == 0} ? '/adminpage/disciplines/create' : '/adminpage/disciplines/' + ${discipline.id} + '/edit'"
                        method="post" th:object="${discipline}">
                        <div th:if="${#fields.hasErrors('shortName')}" class="alert alert-danger">
                            <div th:errors="*{shortName}"></div>
                        </div>
                        <div class="form-group">
                            <label>Сокращение (заглавные буквы) <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{shortName}" class="form-control" required pattern="[А-ЯA-Z]+">
                        </div>

                        <div th:if="${#fields.hasErrors('fullName')}" class="alert alert-danger">
                            <div th:errors="*{fullName}"></div>
                        </div>
                        <div class="form-group">
                            <label>Полное название <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{fullName}" class="form-control" required>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" th:field="*{visible}" class="form-check-input" id="visible">
                            <label class="form-check-label" for="visible">Видимый (отображается в интерфейсе)</label>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-success">Сохранить</button>
                            <a href="/adminpage/disciplines" class="btn btn-secondary ml-2">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
            <br>
        </div>
    </div>
</div>

</body>
</html>
