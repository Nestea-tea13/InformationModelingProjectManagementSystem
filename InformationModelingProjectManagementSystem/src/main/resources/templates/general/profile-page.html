<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Профиль пользователя</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link type="text/css" rel="StyleSheet" href="https://bootstraptema.ru/plugins/2016/remodal/remodal.css" />
    <link type="text/css" rel="StyleSheet" href="https://bootstraptema.ru/plugins/2016/remodal/remodal-default-theme.css" />
    <link rel="stylesheet" type="text/css" href="/css/forms.css" />
    <script src="https://bootstraptema.ru/plugins/jquery/jquery-1.11.3.min.js"></script>
    <script src="https://bootstraptema.ru/plugins/2016/remodal/remodal.js"></script>
    <style>
        .info-label {
            font-size: 0.8rem;
            color: #6c757d;
        }
        .info-value {
            font-size: 1rem;
            font-weight: 500;
        }
        .custom-card {
            width: 60%;
            margin: 0 auto;
        }
        .profile-row {
            margin-bottom: 1.5rem;
        }
        @media (max-width: 768px) {
            .custom-card {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <header th:if="${flagRoleAdmin}" th:insert="blocks/headers::header-admin-page"/>
    <header th:unless="${flagRoleAdmin}" th:insert="blocks/headers::header-user-page"/>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card custom-card">
                    <div class="card-header text-center">
                        <h4>👤 Ваши персональные данные</h4>
                    </div>
                    <div class="card-body">

                        <div class="row profile-row text-center">
                            <div class="col-md-4">
                                <div class="info-label">Фамилия</div>
                                <div class="info-value" th:text="${person.sername}"></div>
                            </div>
                            <div class="col-md-4">
                                <div class="info-label">Имя</div>
                                <div class="info-value" th:text="${person.name}"></div>
                            </div>
                            <div class="col-md-4">
                                <div class="info-label">Отчество</div>
                                <div class="info-value" th:text="${person.patronymic != null ? person.patronymic : '—'}"></div>
                            </div>
                        </div>

                        <div class="row profile-row text-center">
                            <div class="col-md-4 offset-md-2">
                                <div class="info-label">Пол</div>
                                <div class="info-value" th:text="${person.gender != null ? person.gender : '—'}"></div>
                            </div>
                            <div class="col-md-4">
                                <div class="info-label">Дата рождения</div>
                                <div class="info-value" th:text="${person.formattedBirthday}"></div>
                            </div>
                        </div>

                        <div class="row profile-row text-center">
                            <div class="col-md-12">
                                <div class="info-label">Электронная почта</div>
                                <div class="info-value" th:text="${person.email}"></div>
                            </div>
                        </div>

                        <div class="row profile-row text-center">
                            <div class="col-md-12">
                                <div class="info-label">Должность</div>
                                <div class="info-value" th:text="${person.positionName}"></div>
                            </div>
                        </div>
                        <hr>
                        <div class="text-center">
                            <a th:href="${flagRoleAdmin} ? '/adminpage/profile/edit' : '/profile/edit'" class="btn btn-primary">✏️ Редактировать</a>
                            <a th:href="${flagRoleAdmin} ? '/adminpage/profile/changepassword' : '/profile/changepassword'" class="btn btn-secondary ml-2">🔐 Изменить пароль</a>
                        </div>
                    </div>
                </div>
                <br>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
