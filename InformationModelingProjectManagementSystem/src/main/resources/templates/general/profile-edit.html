<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактирование профиля</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link type="text/css" rel="StyleSheet" href="https://bootstraptema.ru/plugins/2016/remodal/remodal.css" />
    <link type="text/css" rel="StyleSheet" href="https://bootstraptema.ru/plugins/2016/remodal/remodal-default-theme.css" />
    <script src="https://bootstraptema.ru/plugins/jquery/jquery-1.11.3.min.js"></script>
    <script src="https://bootstraptema.ru/plugins/2016/remodal/remodal.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/forms.css" />
</head>

<body>
    <header th:if="${flagRoleAdmin}" th:insert="blocks/headers::header-admin-page"/>
    <header th:unless="${flagRoleAdmin}" th:insert="blocks/headers::header-user-page"/>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>✏️ Редактирование персональных данных</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="${flagRoleAdmin} ? @{/adminpage/profile} : @{/profile}" 
                              method="post" th:object="${person}" id="profileForm">
                            <input type="hidden" th:field="*{id}"/>
                            <input type="hidden" th:field="*{password}"/>
                            <input type="hidden" th:field="*{role}"/>
                            <input type="hidden" th:field="*{position}"/>

                            <div th:if="${#fields.hasErrors('sername')}" class="alert alert-danger">
                                <div th:errors="*{sername}"></div>
                            </div>
                            <div class="form-group">
                                <label>Фамилия <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{sername}" class="form-control"
                                       oninput="this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1).toLowerCase()">
                            </div>

                            <div th:if="${#fields.hasErrors('name')}" class="alert alert-danger">
                                <div th:errors="*{name}"></div>
                            </div>
                            <div class="form-group">
                                <label>Имя <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control"
                                       oninput="this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1).toLowerCase()">
                            </div>

                            <div class="form-group">
                                <label>Отчество</label>
                                <input type="text" th:field="*{patronymic}" class="form-control"
                                       oninput="this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1).toLowerCase()">
                                <small class="form-text text-muted">При отсутствии отчества ничего не вводить</small>
                            </div>

                            <div th:if="${#fields.hasErrors('gender')}" class="alert alert-danger">
                                <div th:errors="*{gender}"></div>
                            </div>
                            <div class="form-group">
                                <label>Пол</label>
                                <div class="radio-group">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="genderFemale" th:field="*{gender}" value="женщина">
                                        <label class="form-check-label" for="genderFemale">женщина</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="genderMale" th:field="*{gender}" value="мужчина">
                                        <label class="form-check-label" for="genderMale">мужчина</label>
                                    </div>
                                </div>
                            </div>

                            <div th:if="${#fields.hasErrors('birthday')}" class="alert alert-danger">
                                <div th:errors="*{birthday}"></div>
                            </div>
                            <div class="form-group">
                                <label>Дата рождения</label>
                                <input type="date" th:field="*{birthday}" class="form-control"
                                       th:min="${birthdayDateBorders[0]}" th:max="${birthdayDateBorders[1]}">
                            </div>

                            <div th:if="${#fields.hasErrors('email')}" class="alert alert-danger">
                                <div th:errors="*{email}"></div>
                            </div>
                            <div class="form-group">
                                <label>Электронная почта <span class="text-danger">*</span></label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com">
                            </div>

                            <div class="form-group text-center">
                                <button type="submit" class="btn btn-success" data-remodal-target="modal-edit">Сохранить</button>
                                <a th:href="${flagRoleAdmin} ? '/adminpage/profile' : '/profile'" 
                                   class="btn btn-secondary ml-2">Отмена</a>
                            </div>
                        </form>
                    </div>
                </div>
                <br>
            </div>
        </div>
    </div>

    <!-- Модальное окно подтверждения -->
    <div class="remodal text-center" data-remodal-id="modal-edit">
        <button data-remodal-action="close" class="remodal-close"></button>
        <h1>Подтверждение</h1>
        <p>Вы действительно хотите изменить свои данные?<br>После подтверждения данные будут обновлены.</p>
        <a class="remodal-confirm mr-4" onclick="document.getElementById('profileForm').submit();">Да</a>
        <button data-remodal-action="cancel" class="remodal-cancel">Нет</button>
    </div>
</body>
</html>
