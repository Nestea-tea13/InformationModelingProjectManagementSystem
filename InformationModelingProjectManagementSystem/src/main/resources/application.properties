spring.application.name=InformationModelingProjectManagementSystem

# Настройки сервера
server.port=8080
server.servlet.context-path=/

# Конфигурация источника данных (Data source)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/InformationModelingProjectManagementSystem-db
spring.datasource.username=postgres
spring.datasource.password=12345

# Hibernate конфигурация
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=true

# Почта
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pukha2002@gmail.com
spring.mail.password=ucplofyvlfzwkidd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp

# Настройки загрузки файлов
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
file.upload-dir=uploads

# Spring Boot конфигурация
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=uploads

spring.thymeleaf.cache=false